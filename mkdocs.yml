site_name: GP1 & GP2 Lesson Plans
site_url: https://whiskethy.github.io/GP1_and_2_Lesson_plans
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/section-theme.js

# Nav is intentionally NOT explicit: each course (and Standards) is a directory
# reference, so the nav mirrors the docs folder structure and new folders/pages
# under a course appear automatically. Internal planning pages are excluded below.
# When reorganizing the docs tree, only this exclude list needs updating.
exclude_docs: |
  SY27 Course Planning/GP1/Bumped Topics.md
  SY27 Course Planning/GP1/GP1 Sub Prep - Sept 2026.md
  SY27 Course Planning/GP1/GP1 Task List State.md
  SY27 Course Planning/GP1/Playlist details - YouTube Studio.md
  SY27 Course Planning/GP1/Q3 & Q4 GP1 YouTube Playlist.md
  SY27 Course Planning/GP1/Q1/GP1 Unit 1 Planning.md
  SY27 Course Planning/GP1/Q1/GP1 Unit 2 Planning.md
  SY27 Course Planning/GP1/Q1/GP1 Unit 3 Planning.md
  SY27 Course Planning/GP2/Bumped Topics.md
  SY27 Course Planning/GP2/GP2 Task List State.md
  SY27 Course Planning/GP2/Q1/GP2 Unit 1 Planning.md
  SY27 Course Planning/GP2/Q1/GP2 Unit 2 Planning.md
  SY27 Course Planning/GP2/Q1/GP2 Unit 3 Planning.md
  SY27 Course Planning/GP2/Q2/GP2 Unit 4 Planning.md
  SY27 Course Planning/PBL Curriculum Design Reference.md
  SY27 Course Planning/SY27 GP2 Planning.md
  SY27 Course Planning/index.md

nav:
  - Home: index.md
  - GP1: SY27 Course Planning/GP1
  - GP2: SY27 Course Planning/GP2
  - Standards: Standards

plugins:
  - search
  - tags
  - roamlinks

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true