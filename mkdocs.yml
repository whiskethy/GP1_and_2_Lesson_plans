site_name: GP1 & GP2 Lesson Plans
site_url: https://whiskethy.github.io/GP1_and_2_Lesson_plans
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/section-theme.js

docs_dir: .build/docs
site_dir: .build/site

# No nav: list on purpose. MkDocs builds the sidebar and tabs from the folders,
# so a new or moved file shows up in the right place by itself.

plugins:
  - search
  - tags
  - roamlinks

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true