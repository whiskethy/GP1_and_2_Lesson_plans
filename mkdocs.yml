site_name: GP1 & GP2 Lesson Plans
site_url: https://whiskethy.github.io/GP1_and_2_Lesson_plans
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - GP1:
    - Overview: SY27 Course Planning/GP1/index.md
    - Scope & Sequence: SY27 Course Planning/GP1/Scope & Sequence - Game Programming 1 (GP1).md
    - Q1 Calendar: SY27 Course Planning/GP1/GP1 Q1 Calendar.md
    - Q1 Materials: SY27 Course Planning/GP1/GP1 Q1 Materials.md
    - Days:
      - SY27 Course Planning/GP1/Days/index.md
      - Week 01: SY27 Course Planning/GP1/Days/Week 01/index.md
      - Week 02: SY27 Course Planning/GP1/Days/Week 02/index.md
      - Week 03: SY27 Course Planning/GP1/Days/Week 03/index.md
      - Week 04: SY27 Course Planning/GP1/Days/Week 04/index.md
      - Week 05: SY27 Course Planning/GP1/Days/Week 05/index.md
      - Week 06: SY27 Course Planning/GP1/Days/Week 06/index.md
      - Week 07: SY27 Course Planning/GP1/Days/Week 07/index.md
      - Week 08: SY27 Course Planning/GP1/Days/Week 08/index.md
    - Worksheets:
      - SY27 Course Planning/GP1/Worksheets/index.md
      - "Render Loop Worksheet": SY27 Course Planning/GP1/Worksheets/GP1 Q1 Day 11 - Render Loop Worksheet.md
      - "Transforms Worksheet": SY27 Course Planning/GP1/Worksheets/GP1 - Transforms Worksheet.md
  - GP2:
    - Overview: SY27 Course Planning/GP2/index.md
    - Scope & Sequence: SY27 Course Planning/GP2/Scope & Sequence - Game Programming 2 (GP2).md
    - Q1 Calendar: SY27 Course Planning/GP2/GP2 Q1 Calendar.md
    - Q1 Materials: SY27 Course Planning/GP2/GP2 Q1 Materials.md
    - Days:
      - SY27 Course Planning/GP2/Days/index.md
      - Week 01: SY27 Course Planning/GP2/Days/Week 01/index.md
      - Week 02: SY27 Course Planning/GP2/Days/Week 02/index.md
      - Week 03: SY27 Course Planning/GP2/Days/Week 03/index.md
      - Week 04: SY27 Course Planning/GP2/Days/Week 04/index.md
      - Week 05: SY27 Course Planning/GP2/Days/Week 05/index.md
      - Week 06: SY27 Course Planning/GP2/Days/Week 06/index.md
      - Week 07: SY27 Course Planning/GP2/Days/Week 07/index.md
      - Week 08: SY27 Course Planning/GP2/Days/Week 08/index.md
    - Worksheets:
      - SY27 Course Planning/GP2/Worksheets/index.md
      - "Variables & Code Reading Check (Sub)": SY27 Course Planning/GP2/Worksheets/GP2 - Variables & Code Reading Check (Sub).md
    - Extras:
      - "GitHub Onboarding": SY27 Course Planning/GP2/GP2 GitHub Onboarding.md
      - "GitHub & Classmoji Setup": SY27 Course Planning/GP2/GP2 GitHub & Classmoji Setup.md
      - "Guided Notes - Intro to C++": SY27 Course Planning/GP2/Guided Notes - Intro to C++ (Slides 1-34).md
      - "Loop Slides Content Plan": SY27 Course Planning/GP2/Loop Slides Content Plan.md
      - "Unit 1 Practice Programs": SY27 Course Planning/GP2/Unit 1 Practice Programs (Slides 1-131).md
  - Standards:
    - Standards/index.md
    - "CSTA Standards": Standards/CSTA Standards.md
    - "ISTE Standards": Standards/ISTE Standards.md
    - "ISBE CS Standards": Standards/ISBE Computer Science Standards.md
    - "CCRS Mathematics": Standards/CCRS-MathematicsStandards.md
    - "CCRS Reading": Standards/CCRS-ReadingStandards.md

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true